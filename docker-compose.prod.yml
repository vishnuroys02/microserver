name: msdevops
services:
  user-service:
    image: ${REGISTRY}/user-service:${IMAGE_TAG}
    restart: unless-stopped
    networks: [app-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  product-service:
    image: ${REGISTRY}/product-service:${IMAGE_TAG}
    restart: unless-stopped
    networks: [app-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  order-service:
    image: ${REGISTRY}/order-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
    volumes:
      - order-data:/tmp
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks: [app-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - product-service
      - order-service
    networks: [app-net]

networks:
  app-net:
    driver: bridge

volumes:
  order-data:
