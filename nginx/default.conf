server {
    listen 80;

    location = /health {
        return 200 'nginx ok';
        add_header Content-Type text/plain;
    }

    location /api/user/ {
        proxy_pass http://user-service:3000/;
    }

    location /api/product/ {
        proxy_pass http://product-service:3000/;
    }

    location /api/order/ {
        proxy_pass http://order-service:3000/;
    }
}
