services:
  user-service:
    build: ./user-service
    image: user-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [appnet]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  product-service:
    build: ./product-service
    image: product-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [appnet]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  order-service:
    build: ./order-service
    image: order-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [appnet]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks: [appnet]

networks:
  appnet:

volumes:
  nginx_logs:
